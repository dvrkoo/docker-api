services:
  faceforensics-api:
    build: .
    container_name: faceforensics-detector
    volumes:
      - ./input:/data/input
      - ./output:/data/output
    environment:
      - WATCH_FOLDER=/data/input
      - OUTPUT_FOLDER=/data/output
      - FORCE_CPU=true
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

  faceforensics-api-cpu:
    build: .
    container_name: faceforensics-detector-cpu
    volumes:
      - ./input:/data/input
      - ./output:/data/output
    environment:
      - WATCH_FOLDER=/data/input
      - OUTPUT_FOLDER=/data/output
      - FORCE_CPU=true
    restart: unless-stopped
